<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
    <script>
        // Your web app's Firebase configuration
        var firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        function loginWithEmail() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Signed in
                    console.log('Logged in with Email:', userCredential.user);
                })
                .catch((error) => {
                    console.error('Error logging in:', error);
                });
        }

        function loginWithID() {
            const id = document.getElementById('id').value;
            // Implement authentication via ID
            // Placeholder for actual authentication logic
            console.log('Logged in with ID:', id);
        }
    </script>
</head>
<body>
    <h1>Login</h1>
    <div>
        <button onclick="document.getElementById('emailForm').style.display='block'; document.getElementById('idForm').style.display='none';">Email Login</button>
        <button onclick="document.getElementById('idForm').style.display='block'; document.getElementById('emailForm').style.display='none';">ID Login</button>
    </div>
    <div id="emailForm">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="loginWithEmail()">Login with Email</button>
    </div>
    <div id="idForm" style="display:none;">
        <input type="text" id="id" placeholder="Enter ID">
        <button onclick="loginWithID()">Access</button>
    </div>
</body>
</html>
